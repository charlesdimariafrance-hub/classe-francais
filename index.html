<style>
/* Diptyque : mosaïque des dossiers à gauche, grande page du cours à droite, les devoirs derrière une flèche */
:root{--ink:#123a3e;--bg:#eef2ef;--panel:#fff;--line:#d3ded8;--muted:#5a7470;--soft:#e4eee9;--accent:#d9952a;--mae:#d8432f;--cos:#1f68a8;--fix:#0f7a3d;--paper:#fff;--shadow:0 6px 22px #12383c1c;

*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--body);display:flex;flex-direction:column;overflow:hidden;padding-top:env(safe-area-inset-top,0px)}

button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:7px 11px}

header h1{font:700 19px var(--display);margin:0;letter-spacing:-.01em}header h1 small{display:block;font:12px var(--body);color:var(--muted);letter-spacing:.04em;text-transform:uppercase}

.box{background:var(--panel);border-radius:12px;padding:18px;width:min(540px,100%);margin-top:6vh;display:flex;flex-direction:column;gap:10px}

#gate{position:fixed;inset:0;z-index:300;background:var(--bg);display:grid;place-items:center;padding:16px}

.door .books{display:flex;justify-content:center;gap:8px}.door .books span{font:700 11px var(--body);letter-spacing:.08em;text-transform:uppercase;color:#fff;padding:3px 8px;border-radius:4px}

.door input{font:700 26px var(--body);letter-spacing:.3em;text-align:center;text-transform:uppercase;padding:12px}

@media (max-width:860px){#menuBtn{display:inline-block}aside{position:fixed;inset:0 auto 0 0;z-index:60;width:min(320px,88vw);transform:translateX(-102%);transition:transform .2s;box-shadow:var(--shadow);padding-top:max(14px,env(safe-area-inset-top,0px))}aside.open{transform:none}.tabs{margin-left:0}.side{display:none}.diptyque{top:auto;position:fixed;bottom:max(16px,env(safe-area-inset-bottom,0px));right:max(12px,env(safe-area-inset-right,0px));writing-mode:horizontal-tb;padding:10px 14px;margin:0}.eval{grid-template-columns:1fr}}
/* Zoom : la page du livre s'agrandit (boutons, pincement à deux doigts, double tape) */
.sheet{width:calc(min(880px,100%) * var(--z,1));flex-shrink:0;touch-action:pan-x pan-y}

.zc{display:inline-flex;gap:3px;align-items:center}.zc .zlab{min-width:58px;font-size:13px}

.cmk{position:absolute;inset:0;pointer-events:none;z-index:5}

.cpin:hover{background:#0b5e2f}.cpin .g{background:#fff;color:var(--fix);border-radius:10px;padding:0 6px;font-size:12px}

.th .cd{position:absolute;top:3px;left:3px;min-width:16px;height:16px;border-radius:8px;background:var(--fix);border:1px solid #fff;color:#fff;font:700 10px/14px var(--body);font-style:normal;text-align:center;padding:0 3px}
@media (max-width:860px){.cpin{font-size:12px;padding:4px 9px 4px 7px}}
#pnav{display:none}#scrim{position:fixed;inset:0;z-index:55;background:#081a1c80}
.closeSide{display:none}
body{height:100dvh}
/* Téléphone : tout en grand, navigation toujours en bas de l'écran */
@media (max-width:860px){
  header{gap:6px 8px;padding-top:6px;padding-bottom:6px}

<script>
const REPO='charlesdimariafrance-hub/classe-francais';
const R=(a,b)=>Array.from({length:b-a+1},(_,i)=>a+i);
const SECTIONS=[
 {key:'mae3',book:'mae',bt:'Mon alter ego 2',title:'Dossier 3 · Choisir son cadre de vie',pages:R(3,18),marks:{3:'Ouverture',4:'Leçon 1',8:'Leçon 2',12:'Leçon 3',16:'Fenêtre sur',18:'Comprendre un écrit'}},
 {key:'mae4',book:'mae',bt:'Mon alter ego 2',title:'Dossier 4 · S’insérer dans la vie active',pages:[...R(19,22),22.5,...R(23,33)],marks:{19:'Ouverture',20:'Leçon 1',22.5:'À retenir',23:'Leçon 2',27:'Leçon 3',31:'Fenêtre sur',33:'Comprendre à l’oral'}},
 {key:'cos1',book:'cos',bt:'Cosmopolite 3',title:'Dossier 1 · Et si on allait vivre ailleurs ?',pages:R(4,21),marks:{4:'Ouverture',6:'Leçon 1',8:'Leçon 2',10:'Focus langue',12:'Leçon 3',14:'Leçon 4',16:'Focus langue',18:'Stratégies',19:'Projets',20:'DELF'}},
 {key:'cos2',book:'cos',bt:'Cosmopolite 3',title:'Dossier 2 · Nous nous installons dans un pays francophone',pages:R(22,39),marks:{22:'Ouverture',24:'Leçon 1',26:'Leçon 2',28:'Focus langue',30:'Leçon 3',32:'Leçon 4',34:'Focus langue',36:'Stratégies',37:'Projets',38:'DELF'}},
 {key:'maeA',book:'mae',bt:'Mon alter ego 2',title:'Sommaire, DELF et annexes',annex:1,pages:[1,2,...R(34,64)],marks:{1:'Couverture',2:'Sommaire',34:'DELF A2',45:'Précis grammatical',54:'Phonie-graphie',59:'Conjugaisons',62:'Cartes'}},
 {key:'cosA',book:'cos',bt:'Cosmopolite 3',title:'Sommaire et annexes',annex:1,pages:[1,2,3,...R(40,75)],marks:{1:'Couverture',3:'Contenus',42:'S’exercer D1',46:'S’exercer D2',50:'Phonétique',55:'Grammaire',72:'Conjugaison'}}
];
const pid=(b,n)=>b+String(Math.floor(n)).padStart(2,'0')+(Number.isInteger(n)?'':'b');
const pn=n=>Number.isInteger(n)?String(n):Math.floor(n)+' bis';
const SEQ=[];SECTIONS.forEach(s=>s.pages.forEach(n=>SEQ.push({id:pid(s.book,n),n,s})));
const S={i:0,view:'livre',tool:'read',color:'#ffd400',teacher:false,asStudent:false,ann:{},copies:[],guides:{},gann:{},K:null,T:null,meta:null};
const COLORS=['#ffd400','#7ee07a','#7cc4ff','#ff8fb1','#d8432f'];
const $=s=>document.querySelector(s);
const h=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e};

const edit=()=>S.teacher&&!S.asStudent;
const cur=()=>SEQ[S.i];
const hasContent=it=>!!(it.txt||it.fix||it.a);
const mediaKind=it=>it.at||(it.t==='audio'||it.t==='video'?it.t:'');
const LS={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};

function toast(t){const e=h('div','toast',esc(t));document.body.append(e);setTimeout(()=>e.remove(),3000)}
function markFor(s,n){let m='';for(const k of Object.keys(s.marks).map(Number).sort((a,b)=>a-b))if(k<=n)m=s.marks[k];return m}

/* ---------- Chiffrement ---------- */
const ub=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const bu=buf=>{let s='';const a=new Uint8Array(buf);for(let i=0;i<a.length;i+=0x8000)s+=String.fromCharCode(...a.subarray(i,i+0x8000));return btoa(s)};
const aes=raw=>crypto.subtle.importKey('raw',raw,'AES-GCM',false,['encrypt','decrypt']);
async function dec(key,buf){const a=new Uint8Array(buf);return crypto.subtle.decrypt({name:'AES-GCM',iv:a.slice(0,12)},key,a.slice(12))}
async function enc(key,data){const iv=crypto.getRandomValues(new Uint8Array(12));const c=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,data);const o=new Uint8Array(12+c.byteLength);o.set(iv);o.set(new Uint8Array(c),12);return o}
async function pbk(pw,salt){const b=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:S.meta.iter,hash:'SHA-256'},b,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function unwrap(file,pw){const w=await (await fetch(file+'?t='+Date.now(),{cache:'no-store'})).json();return dec(await pbk(pw,ub(w.salt)),ub(w.data))}
async function wrap(pw,data){const salt=crypto.getRandomValues(new Uint8Array(16));return{salt:bu(salt),data:bu(await enc(await pbk(pw,salt),data))}}
const keyFor=p=>p.startsWith('t/')?S.T:S.K;
async function loadBin(p,fresh){const r=await fetch(p+(fresh?'?t='+Date.now():''),fresh?{cache:'no-store'}:{});if(!r.ok)throw new Error('absent');return dec(keyFor(p),await r.arrayBuffer())}
const URLS=new Map();
function blobUrl(p,type){if(!URLS.has(p))URLS.set(p,loadBin(p).then(b=>URL.createObjectURL(new Blob([b],{type:type||'image/jpeg'}))).catch(e=>{URLS.delete(p);throw e}));return URLS.get(p)}
/* Un fichier tout juste envoyé met 1 à 2 minutes à être en ligne : on réessaie tout seul */
function retryLater(el){const n=+(el.dataset.try||0);if(n>=8)return;el.dataset.try=n+1;setTimeout(()=>{if(!el.isConnected)return;const p=el.dataset.b;loadBin(p,true).then(b=>{const u=URL.createObjectURL(new Blob([b],{type:el.dataset.mt||'image/jpeg'}));URLS.set(p,Promise.resolve(u));el.src=u}).catch(()=>retryLater(el))},20000)}
const io=new IntersectionObserver(es=>es.forEach(e=>{if(!e.isIntersecting)return;io.unobserve(e.target);const el=e.target;blobUrl(el.dataset.b,el.dataset.mt).then(u=>el.src=u).catch(()=>retryLater(el))}),{rootMargin:'300px'});
function hydrate(root){root.querySelectorAll('[data-b]:not([src])').forEach(e=>io.observe(e))}
const bpath=(id,teacher)=>(teacher?'t/b/':'d/b/')+id+'.bin';

/* ---------- Enregistrement sur GitHub (professeur) ---------- */
const SHA={};
async function gh(path,opt={}){const tok=LS.get('cf_tok');if(!tok)throw{code:'token'};const r=await fetch(`https://api.github.com/repos/${REPO}/contents/${path}`,{...opt,headers:{Authorization:'Bearer '+tok,Accept:'application/vnd.github+json',...(opt.body?{'Content-Type':'application/json'}:{})}});if(r.status===401||r.status===403)throw{code:'token'};return r}
async function putFile(path,bytes,msg){
  let sha=SHA[path];
  if(sha===undefined){const r=await gh(path+'?ref=main');sha=r.ok?(await r.json()).sha:null}
  let r=await gh(path,{method:'PUT',body:JSON.stringify({message:msg||'Mise à jour '+path,content:bu(bytes),branch:'main',...(sha?{sha}:{})})});
  if(r.status===409||r.status===422){const g=await gh(path+'?ref=main');sha=g.ok?(await g.json()).sha:null;r=await gh(path,{method:'PUT',body:JSON.stringify({message:msg||'Mise à jour '+path,content:bu(bytes),branch:'main',...(sha?{sha}:{})})})}
  if(!r.ok)throw{code:'http',status:r.status};SHA[path]=(await r.json()).content.sha
}
const DIRTY=new Set();let flushT=null,flushing=Promise.resolve();
function scheduleSave(which){DIRTY.add(which);status('Enregistrement…');clearTimeout(flushT);flushT=setTimeout(flush,1200)}
function flush(){flushing=flushing.then(async()=>{
  const todo=[...DIRTY];DIRTY.clear();
  try{for(const w of todo){
    if(w==='d')await putFile('d/state.bin',await enc(S.K,new TextEncoder().encode(JSON.stringify({ann:S.ann,copies:S.copies}))),'Annotations et devoirs');
    else await putFile('t/state.bin',await enc(S.T,new TextEncoder().encode(JSON.stringify({guides:S.guides,gann:S.gann}))),'Préparation');
  }status('Enregistré ✓')}
  catch(e){todo.forEach(w=>DIRTY.add(w));status('Non enregistré');if(e?.code==='token')askToken(()=>flush());else toast('L’enregistrement a échoué. Vérifie ta connexion, je réessaierai à la prochaine modification.')}
})}
async function uploadBlob(bytes,teacher){const id=[...crypto.getRandomValues(new Uint8Array(8))].map(x=>x.toString(16).padStart(2,'0')).join('');const p=bpath(id,teacher);await putFile(p,await enc(teacher?S.T:S.K,bytes),'Ajout de fichier');return id}
function askToken(then){modal(b=>{b.innerHTML=`<h3>Clé GitHub</h3><p class="hint">Pour enregistrer, le site a besoin de ta clé GitHub (« fine-grained token », dépôt classe-francais, permission Contents : Read and write). Elle reste seulement dans ce navigateur.</p><label>Clé<input id="tk" placeholder="github_pat_…" type="password"></label>`;const r=h('div','row'),c=h('button','','Plus tard'),s=h('button','on','Enregistrer la clé');c.onclick=close;s.onclick=()=>{const v=$('#tk').value.trim();if(!v)return;LS.set('cf_tok',v);close();then&&then()};r.append(c,s);b.append(r)})}

/* ---------- Historique : annuler / rétablir ---------- */
const HIST={u:[],r:[]};
function apply(store,list){store.set(list);refresh()}
function commit(store,list){HIST.u.push({store,prev:store.get(),next:list});if(HIST.u.length>80)HIST.u.shift();HIST.r=[];apply(store,list);return Promise.resolve()}
function undo(){const a=HIST.u.pop();if(!a)return toast('Rien à annuler');HIST.r.push(a);apply(a.store,a.prev)}
function redo(){const a=HIST.r.pop();if(!a)return toast('Rien à rétablir');HIST.u.push(a);apply(a.store,a.next)}

/* ---------- Médias ---------- */
function pickFile(accept,cb){const p=$('#picker');p.accept=accept;p.multiple=false;p.onchange=()=>{const f=p.files[0];p.value='';if(f)cb(f)};p.click()}
const MIME={mp4:'video/mp4',m4a:'audio/mp4',mov:'video/mp4',webm:'video/webm',mp3:'audio/mpeg',wav:'audio/wav',ogg:'audio/ogg',aac:'audio/aac'};
async function uploadMedia(f,teacher){const ext=(f.name.split('.').pop()||'').toLowerCase();const mt=f.type||MIME[ext];if(!mt||!/^(audio|video)\//.test(mt))throw{code:'fmt'};if(f.size>25*1048576)throw{code:'too_large'};const id=await uploadBlob(await f.arrayBuffer(),teacher);return{id,mt}}
function mediaErr(e){return e?.code==='fmt'?'Ce fichier n’est pas un audio ou une vidéo.':e?.code==='too_large'?'Fichier trop lourd (25 Mo maximum) : fais une vidéo plus courte.':e?.code==='token'?'Ajoute d’abord ta clé GitHub.':'L’envoi a échoué.'}
function mediaHTML(it,teacher){const k=mediaKind(it);if(!it.a)return'';const p=bpath(it.a,teacher);return k==='audio'?`<audio controls data-b="${p}" data-mt="${esc(it.mt||'audio/webm')}"></audio>`:`<video controls playsinline data-b="${p}" data-mt="${esc(it.mt||'video/webm')}"></video>`}

/* ---------- Zoom (téléphone et ordinateur) ---------- */
S.zoom=Math.min(4,Math.max(1,+LS.get('cf_z')||1));
function applyZoom(){document.documentElement.style.setProperty('--z',S.zoom);document.body.classList.toggle('zoomed',S.zoom>1.001);document.querySelectorAll('.zlab').forEach(e=>e.textContent=Math.round(S.zoom*100)+' %')}
function setZoom(z,cx,cy){
  z=Math.min(4,Math.max(1,z));if(Math.abs(z-1)<.04)z=1;const old=S.zoom;if(Math.abs(z-old)<.001)return;
  const sc=$('#ov').hidden?$('#main'):$('#ov'),r=sc.getBoundingClientRect();
  if(cx==null){cx=r.left+r.width/2;cy=r.top+r.height/3}
  const px=sc.scrollLeft+cx-r.left,py=sc.scrollTop+cy-r.top,k=z/old;
  S.zoom=z;applyZoom();
  sc.scrollLeft=px*k-(cx-r.left);sc.scrollTop=py*k-(cy-r.top);
  LS.set('cf_z',z)
}
function zoomCtl(cls){
  const w=h('span','zc'+(cls?' '+cls:'')),m=h('button','','−'),l=h('button','zlab',Math.round(S.zoom*100)+' %'),p=h('button','','+');
  m.setAttribute('aria-label','Rétrécir la page');p.setAttribute('aria-label','Agrandir la page');l.title='Revenir à la taille normale';
  m.onclick=()=>setZoom(S.zoom/1.25);p.onclick=()=>setZoom(S.zoom*1.25);l.onclick=()=>setZoom(1);w.append(m,l,p);return w
}
let PZ=null,pzEnd=0;
const inReader=t=>t.closest&&t.closest('#main,#ov')&&!t.closest('.layer.draw')&&document.querySelector('.sheet');
document.addEventListener('touchstart',e=>{if(e.touches.length===2&&inReader(e.target)){const[a,b]=e.touches;PZ={d:Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)||1,z:S.zoom}}},{passive:true});
document.addEventListener('touchmove',e=>{if(!PZ||e.touches.length!==2)return;if(e.cancelable)e.preventDefault();const[a,b]=e.touches;setZoom(PZ.z*Math.hypot(a.clientX-b.clientX,a.clientY-b.clientY)/PZ.d,(a.clientX+b.clientX)/2,(a.clientY+b.clientY)/2)},{passive:false});
document.addEventListener('touchend',e=>{if(PZ&&e.touches.length<2){PZ=null;pzEnd=Date.now()}},{passive:true});
let tap={t:0,x:0,y:0};
document.addEventListener('pointerup',e=>{
  if(e.pointerType!=='touch'||PZ||Date.now()-pzEnd<400)return;
  const sh=e.target.closest&&e.target.closest('.sheet');if(!sh||e.target.closest('button,.it')||sh.querySelector('.layer.draw'))return;
  const t=Date.now();
  if(t-tap.t<320&&Math.hypot(e.clientX-tap.x,e.clientY-tap.y)<40){tap.t=0;setZoom(S.zoom>1.05?1:2,e.clientX,e.clientY)}
  else tap={t,x:e.clientX,y:e.clientY}
});

/* ---------- Glisser-déposer (notes, audios, vidéos, repères) ---------- */
function draggable(el,box,drop){
  el.addEventListener('pointerdown',ev=>{
    if(ev.button>0)return;const sx=ev.clientX,sy=ev.clientY;let moving=false;
    const mv=e=>{if(!moving&&Math.hypot(e.clientX-sx,e.clientY-sy)<6)return;
      if(!moving){moving=true;el.classList.add('dragging');try{el.setPointerCapture(ev.pointerId)}catch(_){}}
      const r=box.getBoundingClientRect();el.style.left=Math.min(100,Math.max(0,(e.clientX-r.left)/r.width*100))+'%';el.style.top=Math.min(100,Math.max(0,(e.clientY-r.top)/r.height*100))+'%';e.preventDefault()};
    const up=e=>{el.removeEventListener('pointermove',mv);el.removeEventListener('pointerup',up);el.removeEventListener('pointercancel',up);removeEventListener('pointermove',mv);removeEventListener('pointerup',up);
      if(!moving)return;el.classList.remove('dragging');el._moved=true;setTimeout(()=>el._moved=false,400);
      const r=box.getBoundingClientRect();drop({x:Math.min(1,Math.max(0,(e.clientX-r.left)/r.width)),y:Math.min(1,Math.max(0,(e.clientY-r.top)/r.height))})};
    el.addEventListener('pointermove',mv);el.addEventListener('pointerup',up);el.addEventListener('pointercancel',up);addEventListener('pointermove',mv);addEventListener('pointerup',up)
  })
}

}

function period(){if(S.meta.mode==='month'){const ym=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Argentina/Buenos_Aires',year:'numeric',month:'2-digit'}).format(new Date()).slice(0,7);let n=-1;S.meta.starts.forEach((x,i)=>{if(x<=ym)n=i});return n<0?-1:(ym>=nextMonth(S.meta.starts[S.meta.starts.length-1])&&n===S.meta.starts.length-1?S.meta.periods:n)}return Math.floor((Date.now()-new Date(S.meta.start))/(S.meta.days*864e5))}

  if(S.teacher){const t=JSON.parse(new TextDecoder().decode(await loadBin('t/state.bin',true)));S.guides=t.guides||{};S.gann=t.gann||{}}
  const k=location.hash.replace(/^#(prof-?)?/,''),i=SEQ.findIndex(x=>x.id===k);if(i>=0)S.i=i;
  $('#gate').hidden=true;$('#hdr').hidden=false;$('#shell').hidden=false;applyZoom();
  status(S.teacher?'Mode professeur':'');render();
  if(S.teacher&&!LS.get('cf_tok'))setTimeout(()=>askToken(),600)
}

  const n=period();

    const saved=LS.get('cf_t');if(saved)try{return await enter(ub(saved.K),ub(saved.T))}catch(e){LS.del('cf_t')}}
  else{const saved=LS.get('cf_s');if(saved&&saved.n===n)try{return await enter(ub(saved.k))}catch(e){LS.del('cf_s')}
    if(n>=S.meta.periods||n<0){$('#gText').textContent='L’accès à ce cours est terminé. Merci et à bientôt !';inp.hidden=true;btn.hidden=true;return}}
  inp.focus();
  $('#door').onsubmit=async e=>{e.preventDefault();const v=teacherDoor?inp.value:inp.value.toUpperCase().replace(/[^A-Z0-9]/g,'');if(!v)return;
    btn.disabled=true;btn.textContent='Vérification…';err.textContent='';
    try{
      if(teacherDoor){const o=JSON.parse(new TextDecoder().decode(await unwrap('keys/teacher.json',v)));LS.set('cf_t',o);await enter(ub(o.K),ub(o.T))}
      else{const f=`keys/p${String(n).padStart(2,'0')}`;let raw;try{raw=await unwrap(f+'.json',v)}catch(x){raw=await unwrap(f+'b.json',v)}LS.set('cf_s',{n,k:bu(raw)});await enter(raw)}
    }catch(x){err.textContent=teacherDoor?'Mot de passe incorrect.':'Code incorrect ou expiré. Demande le nouveau code à ton professeur.';btn.disabled=false;btn.textContent='Entrer'}
  }
})();
</script>
</body></html>
